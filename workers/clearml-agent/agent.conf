# Included after the private SDK configuration by clearml-gpu-worker.py.
agent {
  package_manager {
    type: pip
    system_site_packages: true
    force_upgrade: false
  }
  # Use the image's Python/CUDA/cuDNN installation.
  ignore_requested_python_version: true
  docker_use_activated_venv: true
  docker_install_opencv_libs: false
  default_docker {
    image: "clearml/yolo12-worker:torch2.7.1-cu126"
    arguments: ["--network=host", "--shm-size=2g"]
  }
}
