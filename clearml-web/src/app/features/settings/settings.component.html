<mat-drawer-container class="settings-container">
  <mat-drawer #settingsDrawer [mode]="narrow() ? 'over' : 'side'" [opened]="!narrow()">
    <div class="settings-nav-heading">
      <span>Settings</span>
      <small>Manage your workspace</small>
    </div>
    <mat-list class="pointer" aria-label="Settings sections">
      <mat-list-item routerLinkActive="active" routerLink="profile">Profile</mat-list-item>
      <mat-list-item routerLinkActive="active" routerLink="webapp-configuration">Configuration</mat-list-item>
      <mat-list-item routerLinkActive="active" routerLink="workspace-configuration">Workspace</mat-list-item>
      @if (iamEnabled() && currentUser()?.role === 'admin') {
        <mat-list-item routerLinkActive="active" routerLink="user-management">User Management</mat-list-item>
      }
      <mat-list-item routerLinkActive="active" routerLink="storage-credentials">Storage Cleanup</mat-list-item>
    </mat-list>
  </mat-drawer>
  <mat-drawer-content>
    @if (narrow()) {
      <div class="settings-mobile-bar">
        <button mat-stroked-button type="button" (click)="settingsDrawer.toggle()">Settings menu</button>
      </div>
    }
    <div class="section">
      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </div>
    <sm-admin-footer></sm-admin-footer>
  </mat-drawer-content>
</mat-drawer-container>
