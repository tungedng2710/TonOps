name: mlops-storage

services:
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    networks: [default, artifacts]
    volumes:
      - ${RUSTFS_DATA_ROOT:?Set RUSTFS_DATA_ROOT in .env}:/data
    ports:
      - ${RUSTFS_BIND_HOST:+${RUSTFS_BIND_HOST}:}${RUSTFS_API_PORT:-7868}:9000
      - ${RUSTFS_BIND_HOST:+${RUSTFS_BIND_HOST}:}${RUSTFS_CONSOLE_PORT:-7869}:9001
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  artifacts:
    name: ${MLOPS_ARTIFACT_NETWORK:-mlops-artifacts}
    internal: true
