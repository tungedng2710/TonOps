name: mlops-mlflow

x-python: &python
  image: mlops-mlflow-core:3.18.0-m1
  pull_policy: never
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &python-env
    MLFLOW_DISABLE_TELEMETRY: "true"
    AWS_EC2_METADATA_DISABLED: "true"
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
  mem_limit: 1g
  cpus: 2

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_db_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, platform_db_admin, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 1g
    cpus: 2

  db-init:
    <<: *python
    restart: "no"
    command: [python, /opt/mlops/init-db.py]
    depends_on:
      postgres: {condition: service_healthy}
    secrets: [postgres_password, tracking_db_password]
    networks: [database]

  storage-init:
    restart: "no"
    entrypoint: [/bin/sh, /opt/mlops/init-storage.sh]
    volumes:
      - ./infra/mlflow/init-storage.sh:/opt/mlops/init-storage.sh:ro
      - ./infra/mlflow/artifact-policy.json:/opt/mlops/artifact-policy.json:ro
    environment: &storage-admin
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
    secrets: [artifact_key, artifact_secret]
    networks: [shared-storage]
    mem_limit: 256m
    cpus: 1

  mlflow:
    <<: *python
    build: ./infra/mlflow
    restart: unless-stopped
    entrypoint: [/opt/mlops/start-mlflow.sh]
    environment:
      <<: *python-env
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_ENABLE_AI_GATEWAY: "false"
      MLFLOW_SERVER_ALLOWED_HOSTS: "127.0.0.1:5000,mlflow:5000,127.0.0.1:${MLFLOW_PORT:-7871},localhost:${MLFLOW_PORT:-7871},0.0.0.0:${MLFLOW_PORT:-7871}${MLFLOW_EXTRA_ALLOWED_HOSTS:+,${MLFLOW_EXTRA_ALLOWED_HOSTS}}"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS:-}"
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      MLFLOW_BOTO_CLIENT_ADDRESSING_STYLE: path
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow-artifacts
      MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      MLFLOW_ARTIFACT_UPLOAD_DOWNLOAD_TIMEOUT: "60"
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      db-init: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    secrets: [tracking_db_password, artifact_key, artifact_secret]
    networks: [frontend, database, shared-storage]
    ports:
      - "0.0.0.0:${MLFLOW_PORT:-7871}:5000"
    healthcheck:
      test: [CMD, python, /opt/mlops/check-mlflow.py]
      interval: 10s
      timeout: 8s
      retries: 4
      start_period: 25s

  client:
    <<: *python
    profiles: [tools]
    entrypoint: [python, /opt/demo/workflow.py]
    environment:
      <<: *python-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_PYTHON_REFRESH: quiet
      MLFLOW_HTTP_REQUEST_TIMEOUT: "20"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
    depends_on:
      mlflow: {condition: service_healthy}
    networks: [frontend]
    volumes:
      - ./examples/sklearn-demo:/opt/demo:ro
      - demo-results:/results

  storage-test:
    <<: *python
    profiles: [tools]
    entrypoint: [python, /opt/tests/mlflow-storage.py]
    environment:
      <<: *python-env
      S3_ENDPOINT: http://rustfs:9000
      CLEARML_ARTIFACT_BUCKET: ${RUSTFS_BUCKET:-tonops-artifacts}
    secrets: [artifact_key, artifact_secret]
    networks: [shared-storage]
    volumes:
      - ./tests/integration:/opt/tests:ro
      - demo-results:/results:ro

  storage-policy-test:
    profiles: [tools]
    entrypoint: [/bin/sh, /opt/tests/mlflow-storage-policy.sh]
    environment: *storage-admin
    networks: [shared-storage]
    volumes:
      - ./tests/integration:/opt/tests:ro
    mem_limit: 256m
    cpus: 1

  storage-copy:
    <<: *python
    profiles: [migration]
    entrypoint: [python, /opt/migration/copy-mlflow-rustfs.py]
    environment:
      <<: [*python-env, *storage-admin]
    networks: [shared-storage, legacy-storage]
    volumes:
      - ./scripts/bootstrap/copy-mlflow-rustfs.py:/opt/migration/copy-mlflow-rustfs.py:ro
      - ${MLOPS_LEGACY_SECRETS_DIR:-./infra/mlflow/.secrets}/rustfs_root_key:/run/secrets/legacy_key:ro
      - ${MLOPS_LEGACY_SECRETS_DIR:-./infra/mlflow/.secrets}/rustfs_root_secret:/run/secrets/legacy_secret:ro

networks:
  frontend:
  database:
    internal: true
  shared-storage:
    external: true
    name: ${MLOPS_ARTIFACT_NETWORK:-mlops-artifacts}
  legacy-storage:
    external: true
    name: ${MLOPS_LEGACY_STORAGE_NETWORK:-mlops-mlflow_storage}

volumes:
  postgres-data:
  demo-results:

secrets:
  postgres_password:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/postgres_password
  tracking_db_password:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/tracking_db_password
  artifact_key:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/artifact_key
  artifact_secret:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/artifact_secret
