name: mlops-mlflow

x-python: &python
  image: mlops-mlflow-core:3.18.0-m1
  pull_policy: never
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: &python-env
    MLFLOW_DISABLE_TELEMETRY: "true"
    AWS_EC2_METADATA_DISABLED: "true"
    OPENBLAS_NUM_THREADS: "1"
    OMP_NUM_THREADS: "1"
  mem_limit: 1g
  cpus: 2

x-gitea-volumes: &gitea-volumes
  - git-data:/var/lib/gitea
  - git-config:/etc/gitea

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform_db_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, platform_db_admin, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 1g
    cpus: 2

  rustfs:
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_REGION: us-east-1
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/rustfs_root_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/rustfs_root_secret
    secrets: [rustfs_root_key, rustfs_root_secret]
    volumes:
      - object-data:/data
    networks: [storage]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: 2

  db-init:
    <<: *python
    restart: "no"
    command: [python, /opt/mlops/init-db.py]
    depends_on:
      postgres: {condition: service_healthy}
    secrets: [postgres_password, tracking_db_password, git_db_password]
    networks: [database]

  storage-init:
    restart: "no"
    entrypoint: [/bin/sh, /opt/mlops/init-storage.sh]
    depends_on:
      rustfs: {condition: service_healthy}
    volumes:
      - ./infra/mlflow/init-storage.sh:/opt/mlops/init-storage.sh:ro
      - ./infra/mlflow/artifact-policy.json:/opt/mlops/artifact-policy.json:ro
    secrets: [rustfs_root_key, rustfs_root_secret, artifact_key, artifact_secret]
    networks: [storage]
    mem_limit: 256m
    cpus: 1

  mlflow:
    <<: *python
    build: ./infra/mlflow
    restart: unless-stopped
    entrypoint: [/opt/mlops/start-mlflow.sh]
    environment:
      <<: *python-env
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_ENABLE_AI_GATEWAY: "false"
      MLFLOW_SERVER_ALLOWED_HOSTS: "127.0.0.1:5000,mlflow:5000,127.0.0.1:${MLFLOW_PORT:-7871},localhost:${MLFLOW_PORT:-7871},0.0.0.0:${MLFLOW_PORT:-7871}${MLFLOW_EXTRA_ALLOWED_HOSTS:+,${MLFLOW_EXTRA_ALLOWED_HOSTS}}"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS:-}"
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      MLFLOW_BOTO_CLIENT_ADDRESSING_STYLE: path
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow-artifacts
      MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      MLFLOW_ARTIFACT_UPLOAD_DOWNLOAD_TIMEOUT: "60"
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      db-init: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    secrets: [tracking_db_password, artifact_key, artifact_secret]
    networks: [frontend, database, storage]
    ports:
      - "0.0.0.0:${MLFLOW_PORT:-7871}:5000"
    healthcheck:
      test: [CMD, python, /opt/mlops/check-mlflow.py]
      interval: 10s
      timeout: 8s
      retries: 4
      start_period: 25s

  gitea:
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/secrets/git_db_password
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: 127.0.0.1
      GITEA__server__ROOT_URL: http://127.0.0.1:${MLFLOW_GITEA_PORT:-7872}/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__FORCE_PRIVATE: "true"
      GITEA__actions__ENABLED: "false"
    depends_on:
      db-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    secrets: [git_db_password]
    volumes: *gitea-volumes
    networks: [frontend, database]
    ports:
      - "127.0.0.1:${MLFLOW_GITEA_PORT:-7872}:3000"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/api/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 1g
    cpus: 2

  git-init:
    profiles: [tools]
    restart: "no"
    entrypoint: [/bin/sh, /opt/mlops/init-gitea.sh]
    depends_on:
      gitea: {condition: service_healthy}
    secrets: [git_admin_password]
    volumes:
      - git-data:/var/lib/gitea
      - git-config:/etc/gitea:ro
      - ./infra/mlflow/init-gitea.sh:/opt/mlops/init-gitea.sh:ro
    networks: [frontend, database]
    mem_limit: 512m
    cpus: 1

  client:
    <<: *python
    profiles: [tools]
    entrypoint: [python, /opt/demo/workflow.py]
    environment:
      <<: *python-env
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_PYTHON_REFRESH: quiet
      MLFLOW_HTTP_REQUEST_TIMEOUT: "20"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
    depends_on:
      mlflow: {condition: service_healthy}
    networks: [frontend]
    volumes:
      - ./examples/sklearn-demo:/opt/demo:ro
      - demo-results:/results

  storage-test:
    <<: *python
    profiles: [tools]
    entrypoint: [python, /opt/tests/mlflow-storage.py]
    environment:
      <<: *python-env
      S3_ENDPOINT: http://rustfs:9000
    secrets: [artifact_key, artifact_secret]
    networks: [storage]
    volumes:
      - ./tests/integration:/opt/tests:ro
      - demo-results:/results:ro

  storage-policy-test:
    profiles: [tools]
    entrypoint: [/bin/sh, /opt/tests/mlflow-storage-policy.sh]
    secrets: [rustfs_root_key, rustfs_root_secret]
    networks: [storage]
    volumes:
      - ./tests/integration:/opt/tests:ro
    mem_limit: 256m
    cpus: 1

  git-test:
    profiles: [tools]
    entrypoint: [/bin/sh, /opt/tests/mlflow-git.sh]
    secrets: [git_admin_password]
    networks: [frontend]
    volumes:
      - ./tests/integration:/opt/tests:ro
    mem_limit: 256m
    cpus: 1

networks:
  frontend:
  database:
    internal: true
  storage:
    internal: true

volumes:
  postgres-data:
  object-data:
  git-data:
  git-config:
  demo-results:

secrets:
  postgres_password:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/postgres_password
  tracking_db_password:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/tracking_db_password
  git_db_password:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/git_db_password
  git_admin_password:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/git_admin_password
  rustfs_root_key:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/rustfs_root_key
  rustfs_root_secret:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/rustfs_root_secret
  artifact_key:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/artifact_key
  artifact_secret:
    file: ${MLFLOW_SECRETS_DIR:-./infra/mlflow/.secrets}/artifact_secret
