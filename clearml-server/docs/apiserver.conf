auth {
    # Local database-backed IAM (disabled by default for backwards compatibility).
    # The bootstrap password should be supplied with
    # CLEARML_IAM_BOOTSTRAP_ADMIN_PASSWORD or
    # CLEARML_IAM_BOOTSTRAP_ADMIN_PASSWORD_FILE, never committed here.
    iam {
        enabled: false
        import_fixed_users: false
        self_signup.enabled: true
        password_policy {
            min_length: 12
            max_length: 128
            require_uppercase: false
            require_lowercase: false
            require_number: false
            require_special: false
            history: 0
            bcrypt_rounds: 12
        }
        lockout {
            max_attempts: 5
            duration_minutes: 15
        }
        audit.enabled: true
    }

    # Fixed users login credentials
    # No other user will be able to login
    # Note: password may be bcrypt-hashed (generate using `python3 -c 'import bcrypt,base64; print(base64.b64encode(bcrypt.hashpw("password".encode(), bcrypt.gensalt())))'`)
    fixed_users {
        enabled: true
        pass_hashed: false
        users: [
            {
                username: "jane"
                password: "12345678"
                name: "Jane Doe"
            },
            {
                username: "john"
                password: "12345678"
                name: "John Doe"
            },
        ]
    }
}
