_description: "Project-scoped AI questions and report drafts."
_default {
    internal: false
    authorize: true
    allow_roles: ["*"]
}
_definitions {
    ask_request {
        type: object
        required: [project]
        properties {
            project { type: string, minLength: 1, maxLength: 64 }
            question { type: string, minLength: 1, maxLength: 2000 }
            history {
                type: array
                maxItems: 8
                items {
                    type: object
                    required: [role, content]
                    properties {
                        role { type: string, enum: [user, assistant] }
                        content { type: string, maxLength: 3000 }
                    }
                    additionalProperties: false
                }
            }
        }
        additionalProperties: false
    }
    response { type: object, additionalProperties: true }
}
ask {
    "2.36" {
        request: ${_definitions.ask_request} { required: [project, question] }
        response: ${_definitions.response}
    }
}
generate_report {
    "2.36" {
        request: ${_definitions.ask_request}
        response: ${_definitions.response}
    }
}
save_report {
    "2.36" {
        request {
            type: object
            required: [project, title, content]
            properties {
                project { type: string, minLength: 1, maxLength: 64 }
                title { type: string, minLength: 3, maxLength: 160, pattern: ".*\\S.*" }
                content { type: string, minLength: 1, maxLength: 100000 }
            }
            additionalProperties: false
        }
        response: ${_definitions.response}
    }
}
