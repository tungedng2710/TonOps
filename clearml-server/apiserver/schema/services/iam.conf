_description: "Local database-backed identity and group management."

_default {
    internal: false
    authorize: true
    allow_roles: ["system", "root", "admin"]
}

_definitions {
    page_request {
        type: object
        properties {
            page {
                type: integer
                minimum: 0
            }
            page_size {
                type: integer
                minimum: 1
                maximum: 200
            }
        }
        additionalProperties: false
    }
    open_response {
        type: object
        additionalProperties: true
    }
    user_id_request {
        type: object
        required: [user_id]
        properties {
            user_id {
                type: string
                minLength: 1
            }
        }
        additionalProperties: false
    }
    group_id_request {
        type: object
        required: [group_id]
        properties {
            group_id {
                type: string
                minLength: 1
            }
        }
        additionalProperties: false
    }
}

status {
    authorize: null
    allow_roles: ["*"]
    "2.36" {
        request {
            type: object
            additionalProperties: false
        }
        response {
            type: object
            required: [enabled, self_signup_enabled]
            properties {
                enabled { type: boolean }
                self_signup_enabled { type: boolean }
            }
            additionalProperties: false
        }
    }
}

signup {
    authorize: null
    allow_roles: ["*"]
    "2.36" {
        request {
            type: object
            required: [username, email, password]
            properties {
                username {
                    type: string
                    minLength: 3
                    maxLength: 64
                }
                email {
                    type: string
                    format: email
                    maxLength: 254
                }
                display_name {
                    type: string
                    maxLength: 128
                }
                password {
                    type: string
                    minLength: 1
                    maxLength: 128
                }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

me {
    allow_roles: ["*"]
    "2.36" {
        request {
            type: object
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

list_users {
    "2.36" {
        request: ${_definitions.page_request} {
            properties {
                search {
                    type: string
                    maxLength: 128
                }
                role {
                    type: string
                    enum: [admin, user]
                }
                status {
                    type: string
                    enum: [active, disabled]
                }
                sort {
                    type: string
                    enum: [username, -username, display_name, -display_name, role, -role, status, -status, last_login_at, -last_login_at, created_at, -created_at]
                }
            }
        }
        response: ${_definitions.open_response}
    }
}

get_user {
    "2.36" {
        request: ${_definitions.user_id_request}
        response: ${_definitions.open_response}
    }
}

create_user {
    "2.36" {
        request {
            type: object
            required: [username, password]
            properties {
                username {
                    type: string
                    minLength: 3
                    maxLength: 64
                }
                password {
                    type: string
                    minLength: 1
                    maxLength: 128
                }
                display_name {
                    type: string
                    maxLength: 128
                }
                email {
                    type: string
                    format: email
                    maxLength: 254
                }
                role {
                    type: string
                    enum: [admin, user]
                }
                must_change_password { type: boolean }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

update_user {
    "2.36" {
        request {
            type: object
            required: [user_id]
            properties {
                user_id {
                    type: string
                    minLength: 1
                }
                display_name {
                    type: string
                    minLength: 1
                    maxLength: 128
                }
                email {
                    type: [string, "null"]
                    format: email
                    maxLength: 254
                }
                role {
                    type: string
                    enum: [admin, user]
                }
                status {
                    type: string
                    enum: [active, disabled]
                }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

disable_user {
    "2.36" {
        request: ${_definitions.user_id_request}
        response: ${_definitions.open_response}
    }
}
enable_user {
    "2.36" {
        request: ${_definitions.user_id_request}
        response: ${_definitions.open_response}
    }
}
delete_user {
    "2.36" {
        request: ${_definitions.user_id_request}
        response: ${_definitions.open_response}
    }
}

reset_password {
    "2.36" {
        request {
            type: object
            required: [user_id]
            properties {
                user_id {
                    type: string
                    minLength: 1
                }
                password {
                    type: string
                    minLength: 1
                    maxLength: 128
                }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

change_password {
    allow_roles: ["*"]
    "2.36" {
        request {
            type: object
            required: [current_password, new_password]
            properties {
                current_password {
                    type: string
                    minLength: 1
                    maxLength: 128
                }
                new_password {
                    type: string
                    minLength: 1
                    maxLength: 128
                }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

list_groups {
    "2.36" {
        request: ${_definitions.page_request} {
            properties {
                search {
                    type: string
                    maxLength: 128
                }
            }
        }
        response: ${_definitions.open_response}
    }
}

get_group {
    "2.36" {
        request: ${_definitions.group_id_request}
        response: ${_definitions.open_response}
    }
}

create_group {
    "2.36" {
        request {
            type: object
            required: [name]
            properties {
                name {
                    type: string
                    minLength: 1
                    maxLength: 64
                }
                description {
                    type: string
                    maxLength: 512
                }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

update_group {
    "2.36" {
        request {
            type: object
            required: [group_id]
            properties {
                group_id {
                    type: string
                    minLength: 1
                }
                name {
                    type: string
                    minLength: 1
                    maxLength: 64
                }
                description {
                    type: string
                    maxLength: 512
                }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

delete_group {
    "2.36" {
        request: ${_definitions.group_id_request}
        response: ${_definitions.open_response}
    }
}

add_group_member {
    "2.36" {
        request {
            type: object
            required: [group_id, user_id]
            properties {
                group_id {
                    type: string
                    minLength: 1
                }
                user_id {
                    type: string
                    minLength: 1
                }
            }
            additionalProperties: false
        }
        response: ${_definitions.open_response}
    }
}

remove_group_member: ${add_group_member}

list_audit {
    "2.36" {
        request: ${_definitions.page_request} {
            properties {
                actor_user_id { type: string }
                action {
                    type: string
                    maxLength: 64
                }
                target_type {
                    type: string
                    maxLength: 64
                }
                target_id { type: string }
                from_timestamp {
                    type: string
                    format: date-time
                }
                to_timestamp {
                    type: string
                    format: date-time
                }
                sort {
                    type: string
                    enum: [timestamp, -timestamp, action, -action]
                }
            }
        }
        response: ${_definitions.open_response}
    }
}
