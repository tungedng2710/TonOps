_description: "Per-user connections to the configured DataStudio service."
_default {
    internal: false
    authorize: true
    allow_roles: ["*"]
}
_definitions {
    empty_request { type: object, additionalProperties: false }
    response { type: object, additionalProperties: true }
}
status {
    "2.36" { request: ${_definitions.empty_request}, response: ${_definitions.response} }
}
connect {
    "2.36" {
        request {
            type: object
            required: [username, token]
            properties {
                username { type: string, maxLength: 64 }
                token { type: string, maxLength: 256 }
            }
            additionalProperties: false
        }
        response: ${_definitions.response}
    }
}
disconnect {
    "2.36" { request: ${_definitions.empty_request}, response: ${_definitions.response} }
}
datasets {
    "2.36" { request: ${_definitions.empty_request}, response: ${_definitions.response} }
}
revisions {
    "2.36" {
        request {
            type: object
            required: [namespace, dataset]
            properties {
                namespace { type: string, minLength: 1, maxLength: 64 }
                dataset { type: string, minLength: 1, maxLength: 96 }
            }
            additionalProperties: false
        }
        response: ${_definitions.response}
    }
}
