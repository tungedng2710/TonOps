name: clearml-local

x-api-environment: &api-environment
  CLEARML_ELASTIC_SERVICE_HOST: elasticsearch
  CLEARML_ELASTIC_SERVICE_PORT: "9200"
  CLEARML_MONGODB_SERVICE_HOST: mongo
  CLEARML_MONGODB_SERVICE_PORT: "27017"
  CLEARML_REDIS_SERVICE_HOST: redis
  CLEARML_REDIS_SERVICE_PORT: "6379"
  CLEARML_SERVER_DEPLOYMENT_TYPE: linux

services:
  mongo:
    image: mongo:8.0.15
    restart: unless-stopped
    command: --setParameter internalQueryMaxBlockingSortMemoryUsageBytes=196100200
    volumes:
      - ${CLEARML_DATA_ROOT:-./docker-data}/data/mongo_4/db:/data/db
      - ${CLEARML_DATA_ROOT:-./docker-data}/data/mongo_4/configdb:/data/configdb
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.2.3
    restart: unless-stopped
    volumes:
      - ${CLEARML_DATA_ROOT:-./docker-data}/data/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 15

  elasticsearch:
    image: elasticsearch:8.19.9
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${CLEARML_DATA_ROOT:-./docker-data}/data/elastic_7:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  apiserver:
    image: clearml/local-server:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLEARML_SERVER_BASE: ${CLEARML_SERVER_BASE:-clearml/server:latest}
    command: [apiserver]
    restart: unless-stopped
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
    environment:
      <<: *api-environment
      CLEARML__apiserver__auth__iam__enabled: ${CLEARML_IAM_ENABLED:-true}
      CLEARML__apiserver__auth__iam__self_signup__enabled: ${CLEARML_IAM_SELF_SIGNUP_ENABLED:-true}
      CLEARML_IAM_BOOTSTRAP_ADMIN_USERNAME: ${CLEARML_IAM_BOOTSTRAP_ADMIN_USERNAME:-}
      CLEARML_IAM_BOOTSTRAP_ADMIN_PASSWORD_FILE: ${CLEARML_IAM_BOOTSTRAP_ADMIN_PASSWORD_FILE:-}
      CLEARML__apiserver__pre_populate__enabled: "false"
      CLEARML__services__async_urls_delete__enabled: "true"
      CLEARML__services__async_urls_delete__fileserver__url_prefixes: "[${CLEARML_FILES_HOST:-http://localhost:7863},http://fileserver:8081]"
    volumes:
      - ${CLEARML_DATA_ROOT:-./docker-data}/config:/opt/clearml/config
      - ${CLEARML_DATA_ROOT:-./docker-data}/logs:/var/log/clearml
      - ${CLEARML_DATA_ROOT:-./docker-data}/data/fileserver:/mnt/fileserver
    ports:
      - ${CLEARML_API_PORT:-7862}:8008
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8008/debug.ping >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  fileserver:
    image: clearml/local-server:dev
    command: [fileserver]
    restart: unless-stopped
    depends_on:
      apiserver: {condition: service_healthy}
    environment:
      CLEARML__fileserver__auth__enabled: "true"
      CLEARML__fileserver__delete__allow_batch: "true"
    volumes:
      - ${CLEARML_DATA_ROOT:-./docker-data}/config:/opt/clearml/config
      - ${CLEARML_DATA_ROOT:-./docker-data}/logs:/var/log/clearml
      - ${CLEARML_DATA_ROOT:-./docker-data}/data/fileserver:/mnt/fileserver
    ports:
      - ${CLEARML_FILES_PORT:-7863}:8081
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8081/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10

  webserver:
    image: clearml/local-server:dev
    command: [webserver]
    restart: unless-stopped
    depends_on:
      apiserver: {condition: service_healthy}
      fileserver: {condition: service_healthy}
    volumes:
      - ${CLEARML_DATA_ROOT:-./docker-data}/config:/opt/clearml/config
      - ${CLEARML_DATA_ROOT:-./docker-data}/logs:/var/log/clearml
    ports:
      - ${CLEARML_WEB_PORT:-7861}:80
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10

  async_delete:
    image: clearml/local-server:dev
    restart: unless-stopped
    depends_on:
      apiserver: {condition: service_healthy}
      fileserver: {condition: service_healthy}
    environment:
      <<: *api-environment
      PYTHONPATH: /opt/clearml/apiserver
      CLEARML__services__async_urls_delete__fileserver__url_prefixes: "[${CLEARML_FILES_HOST:-http://localhost:7863},http://fileserver:8081]"
    entrypoint: [python3, -m, jobs.async_urls_delete, --fileserver-host, "http://fileserver:8081"]
    volumes:
      - ${CLEARML_DATA_ROOT:-./docker-data}/config:/opt/clearml/config
      - ${CLEARML_DATA_ROOT:-./docker-data}/logs:/var/log/clearml
